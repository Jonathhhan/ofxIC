name: openFrameworks example

on:
  workflow_dispatch:
    inputs:
      hf_media_task:
        description: "Optional paid Hugging Face media smoke"
        required: true
        type: choice
        default: none
        options:
          - none
          - image
          - video
      hf_image_model:
        description: "HF text-to-image model routed through fal-ai"
        required: true
        default: "black-forest-labs/FLUX.1-dev"
      hf_video_model:
        description: "HF text-to-video model routed through fal-ai"
        required: true
        default: "Wan-AI/Wan2.2-TI2V-5B"
  pull_request:
    paths:
      - "src/**"
      - "addon_config.mk"
      - "ofxICExample/**"
      - "scripts/sam-bridge-server.py"
      - "tests/transcription_endpoint_fixture.py"
      - "tests/image_endpoint_fixture.py"
      - ".github/workflows/example-build.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "addon_config.mk"
      - "ofxICExample/**"
      - "scripts/sam-bridge-server.py"
      - "tests/transcription_endpoint_fixture.py"
      - "tests/image_endpoint_fixture.py"
      - ".github/workflows/example-build.yml"

permissions:
  contents: read

concurrency:
  group: openframeworks-example-${{ github.ref }}
  cancel-in-progress: true

env:
  OFXIMGUI_COMMIT: 4b5d04a3e73bbae34d564c9b78143e021f67377a

jobs:
  build-linux-nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve current openFrameworks nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/openframeworks/openFrameworks/releases/tags/nightly)"
          asset_url="$(jq -r '.assets[] | select(.name | endswith("_linux64_gcc6_release.tar.gz")) | .browser_download_url' <<<"$release_json")"
          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "The nightly release has no linux64_gcc6 archive" >&2
            exit 1
          fi
          asset_name="${asset_url##*/}"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "Using $asset_name"

      - name: Cache openFrameworks archive
        id: of-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/of-download/${{ steps.nightly.outputs.asset_name }}
          key: openframeworks-${{ runner.os }}-${{ steps.nightly.outputs.asset_name }}

      - name: Download openFrameworks nightly
        if: steps.of-cache.outputs.cache-hit != 'true'
        env:
          ASSET_NAME: ${{ steps.nightly.outputs.asset_name }}
          ASSET_URL: ${{ steps.nightly.outputs.asset_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/of-download"
          curl --fail --location --retry 3 --show-error \
            "$ASSET_URL" \
            --output "$RUNNER_TEMP/of-download/$ASSET_NAME"

      - name: Extract openFrameworks
        env:
          ASSET_NAME: ${{ steps.nightly.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          of_root="$RUNNER_TEMP/openframeworks/${ASSET_NAME%.tar.gz}"
          mkdir -p "$RUNNER_TEMP/openframeworks"
          tar -xzf "$RUNNER_TEMP/of-download/$ASSET_NAME" \
            -C "$RUNNER_TEMP/openframeworks"
          test -d "$of_root"
          echo "OF_ROOT=$of_root" >> "$GITHUB_ENV"
          echo "OF_NIGHTLY_ASSET=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Install openFrameworks dependencies
        shell: bash
        run: sudo "$OF_ROOT/scripts/linux/ubuntu/install_dependencies.sh" -y

      - name: Prepare addon example
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE" "$OF_ROOT/addons/ofxIC"
          git -C "$OF_ROOT/addons" init ofxImGui
          git -C "$OF_ROOT/addons/ofxImGui" remote add origin https://github.com/jvcleave/ofxImGui.git
          git -C "$OF_ROOT/addons/ofxImGui" fetch --depth 1 origin "$OFXIMGUI_COMMIT"
          git -C "$OF_ROOT/addons/ofxImGui" checkout --detach FETCH_HEAD
          app="$OF_ROOT/apps/myApps/ofxICExample"
          mkdir -p "${app%/*}"
          cp -R "$GITHUB_WORKSPACE/ofxICExample" "$app"
          cp "$OF_ROOT/scripts/templates/linux64/Makefile" "$app/Makefile"
          cp "$OF_ROOT/scripts/templates/linux64/config.make" "$app/config.make"

      - name: Build example
        shell: bash
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          make -C "$app" Release -j2
          test -x "$app/bin/ofxICExample"
          echo "Built with $OF_NIGHTLY_ASSET"

      - name: Install virtual display tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            imagemagick \
            xauth \
            xdotool \
            xvfb

      - name: Launch example and capture GUI
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/gui-smoke"
          mkdir -p "$artifact_dir"

          document_fixture="$artifact_dir/fixture.md"
          document_result="$artifact_dir/document-result.txt"
          printf '%s\n' \
            'The fixture says the process boundary keeps model runtimes outside ofxIC.' \
            >"$document_fixture"
          export OFXIC_DOCUMENT_PATH="$document_fixture"
          export OFXIC_DOCUMENT_RESULT_PATH="$document_result"

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"
              log="$2"
              screenshot="$3"
              geometry="$4"

              "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup EXIT

              window_id=""
              for _ in $(seq 1 60); do
                if ! kill -0 "$app_pid" 2>/dev/null; then
                  echo "Example exited before its window appeared" >&2
                  cat "$log" >&2
                  exit 1
                fi
                window_id="$(xdotool search --name "^ofxIC Endpoint Workbench$" 2>/dev/null | head -n 1 || true)"
                [[ -n "$window_id" ]] && break
                sleep 0.25
              done

              if [[ -z "$window_id" ]]; then
                echo "Example window did not appear" >&2
                cat "$log" >&2
                exit 1
              fi

              sleep 1
              xdotool getwindowgeometry --shell "$window_id" >"$geometry"
              import -display "$DISPLAY" -window "$window_id" "$screenshot"
              test -s "$screenshot"
            ' bash \
            "$app/bin/ofxICExample" \
            "$artifact_dir/ofxICExample.log" \
            "$artifact_dir/ofxICExample.png" \
            "$artifact_dir/window.txt"

          {
            echo "openFrameworks=$OF_NIGHTLY_ASSET"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
          } >"$artifact_dir/build.txt"
          grep -Fxq "Loaded fixture.md" "$document_result"
          grep -Fxq "fixture.md" "$document_result"
          file "$artifact_dir/ofxICExample.png"

      - name: Upload GUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-gui-linux-nightly
          path: ${{ runner.temp }}/gui-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Exercise deterministic audio and SAM through GUI
        timeout-minutes: 5
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/task-gui-smoke"
          mkdir -p "$artifact_dir"
          printf 'OFXIC_AUDIO_FIXTURE' >"$artifact_dir/fixture.wav"
          python3 - "$artifact_dir/fixture.ppm" <<'PY'
          import sys
          open(sys.argv[1], "wb").write(b"P6\n2 2\n255\nabcdefghijkl")
          PY

          python3 -u "$GITHUB_WORKSPACE/tests/transcription_endpoint_fixture.py" \
            --port 18082 >"$artifact_dir/audio-server.log" 2>&1 &
          audio_pid=$!
          python3 -u "$GITHUB_WORKSPACE/scripts/sam-bridge-server.py" \
            --port 18085 --fixture-mask >"$artifact_dir/sam-server.log" 2>&1 &
          sam_pid=$!
          cleanup_servers() {
            kill "$audio_pid" "$sam_pid" 2>/dev/null || true
            wait "$audio_pid" "$sam_pid" 2>/dev/null || true
          }
          trap cleanup_servers EXIT
          for port in 18082 18085; do
            for _ in $(seq 1 40); do
              curl --silent --output /dev/null "http://127.0.0.1:$port/" && break
              sleep 0.1
            done
            curl --silent --output /dev/null "http://127.0.0.1:$port/"
          done

          run_gui() {
            local result="$1"
            local log="$2"
            shift 2
            xvfb-run --auto-servernum \
              --server-args="-screen 0 1280x720x24 -nolisten tcp" \
              bash -euo pipefail -c '
                binary="$1"; log="$2"; result="$3"; shift 3
                env "$@" "$binary" >"$log" 2>&1 &
                app_pid=$!
                cleanup() { kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; }
                trap cleanup EXIT
                for _ in $(seq 1 120); do
                  [[ -s "$result" ]] && break
                  kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                  sleep 0.1
                done
                [[ -s "$result" ]] || { echo "Timed out waiting for GUI task result" >&2; cat "$log" >&2; exit 1; }
              ' bash "$app/bin/ofxICExample" "$log" "$result" "$@"
          }

          for protocol in openai whisper-cpp; do
            result="$artifact_dir/transcription-$protocol.txt"
            run_gui "$result" "$artifact_dir/transcription-$protocol.log" \
              OFXIC_ENDPOINT_URL=http://127.0.0.1:1 \
              OFXIC_TRANSCRIPTION_ENDPOINT_URL=http://127.0.0.1:18082 \
              OFXIC_TRANSCRIPTION_AUTORUN="$protocol" \
              OFXIC_AUDIO_PATH="$artifact_dir/fixture.wav" \
              OFXIC_GUI_RESULT_PATH="$result" \
              OFXIC_SETTINGS_PATH="$artifact_dir/settings-$protocol"
            grep -Fq "Transcription completed" "$result"
            grep -Fq "deterministic GUI transcript" "$result"
          done

          sam_result="$artifact_dir/segmentation.txt"
          run_gui "$sam_result" "$artifact_dir/segmentation.log" \
            OFXIC_ENDPOINT_URL=http://127.0.0.1:1 \
            OFXIC_SEGMENTATION_ENDPOINT_URL=http://127.0.0.1:18085 \
            OFXIC_SEGMENTATION_AUTORUN=1 \
            OFXIC_SEGMENTATION_IMAGE="$artifact_dir/fixture.ppm" \
            OFXIC_SEGMENTATION_POINT_X=0.5 \
            OFXIC_SEGMENTATION_POINT_Y=0.5 \
            OFXIC_SEGMENTATION_NEGATIVE_POINT_X=0.0 \
            OFXIC_SEGMENTATION_NEGATIVE_POINT_Y=0.0 \
            OFXIC_GUI_RESULT_PATH="$sam_result" \
            OFXIC_SETTINGS_PATH="$artifact_dir/settings-sam"
          grep -Fq "Segmentation completed" "$sam_result"
          grep -Fq "PGM mask" "$sam_result"

      - name: Upload deterministic task GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-task-fixtures
          path: ${{ runner.temp }}/task-gui-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Exercise deterministic streaming through GUI
        timeout-minutes: 3
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/streaming-gui-smoke"
          result="$artifact_dir/final.txt"
          partial="$artifact_dir/partial.txt"
          log="$artifact_dir/ofxICExample.log"
          mkdir -p "$artifact_dir"
          python3 -u "$GITHUB_WORKSPACE/scripts/stream-fixture-server.py" \
            --port 18088 >"$artifact_dir/server.log" 2>&1 &
          server_pid=$!
          cleanup_server() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup_server EXIT
          sleep 0.25
          kill -0 "$server_pid"

          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"; log="$2"; result="$3"; partial="$4"
              env OFXIC_ENDPOINT_URL=http://127.0.0.1:18088 \
                OFXIC_MODEL=fixture-model \
                OFXIC_CHAT_STREAM=1 \
                OFXIC_CHAT_AUTORUN="stream this" \
                OFXIC_GUI_RESULT_PATH="$result" \
                OFXIC_STREAM_RESULT_PATH="$partial" \
                "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup() { kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; }
              trap cleanup EXIT
              observed_partial=0
              for _ in $(seq 1 120); do
                [[ -f "$partial" && "$(cat "$partial")" == "First " ]] && observed_partial=1
                [[ -s "$result" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.1
              done
              [[ "$observed_partial" == 1 ]] || { echo "First SSE chunk was not visible before completion" >&2; exit 1; }
              [[ -s "$result" ]] || { echo "Timed out waiting for streaming result" >&2; cat "$log" >&2; exit 1; }
              grep -Fq "Streaming inference completed" "$result"
              grep -Fq "First second" "$result"
              grep -Fq "user: stream this" "$log"
              grep -Fq "route: endpoint=http://127.0.0.1:18088 model=fixture-model" "$log"
              grep -Fq "assistant chunk: First " "$log"
              grep -Fq "assistant: First second" "$log"
            ' bash "$app/bin/ofxICExample" "$log" "$result" "$partial"

      - name: Upload deterministic streaming GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-streaming-fixture
          path: ${{ runner.temp }}/streaming-gui-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Reject unsupported OpenAI video through GUI
        timeout-minutes: 2
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          OFXIC_MEDIA_BACKEND: openai
          OFXIC_MEDIA_ENDPOINT_URL: http://127.0.0.1:1
          OFXIC_MEDIA_AUTORUN: video
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/openai-video-rejection"
          result="$artifact_dir/result.txt"
          log="$artifact_dir/ofxICExample.log"
          mkdir -p "$artifact_dir"
          export OFXIC_MEDIA_RESULT_PATH="$result"

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"
              log="$2"
              result="$3"

              "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup EXIT

              for _ in $(seq 1 40); do
                [[ -s "$result" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.25
              done
              [[ -s "$result" ]] || { echo "Timed out waiting for media rejection" >&2; cat "$log" >&2; exit 1; }
              grep -Fxq "OpenAI images does not support video in ofxIC" "$result"
            ' bash \
            "$app/bin/ofxICExample" \
            "$log" \
            "$result"

          cat "$result"

      - name: Upload OpenAI video rejection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-openai-video-rejection
          path: ${{ runner.temp }}/openai-video-rejection
          if-no-files-found: error
          retention-days: 14

      - name: Exercise deterministic OpenAI image through GUI
        timeout-minutes: 3
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          OFXIC_MEDIA_BACKEND: openai
          OFXIC_MEDIA_ENDPOINT_URL: http://127.0.0.1:18087/v1
          OFXIC_MEDIA_AUTORUN: image
          OFXIC_MEDIA_PROMPT: "deterministic image fixture"
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/image-gui-smoke"
          result="$artifact_dir/result.txt"
          server_log="$artifact_dir/server.log"
          mkdir -p "$artifact_dir"

          python3 -u "$GITHUB_WORKSPACE/tests/image_endpoint_fixture.py" \
            --port 18087 >"$server_log" 2>&1 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT

          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:18087/health >/dev/null && break
            kill -0 "$server_pid" 2>/dev/null || { cat "$server_log" >&2; exit 1; }
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18087/health >/dev/null
          export OFXIC_MEDIA_RESULT_PATH="$result"

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"
              log="$2"
              result="$3"
              screenshot="$4"

              "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup_app() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup_app EXIT

              window_id=""
              for _ in $(seq 1 60); do
                window_id="$(xdotool search --name "^ofxIC Endpoint Workbench$" 2>/dev/null | head -n 1 || true)"
                [[ -n "$window_id" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.25
              done
              [[ -n "$window_id" ]] || { echo "Example window did not appear" >&2; exit 1; }

              for _ in $(seq 1 80); do
                [[ -s "$result" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.25
              done
              [[ -s "$result" ]] || { echo "Timed out waiting for fixture image" >&2; cat "$log" >&2; exit 1; }
              grep -Fq "OpenAI image generation completed" "$result"
              grep -Fq "Saved:" "$result"

              sleep 1
              import -display "$DISPLAY" -window "$window_id" "$screenshot"
              test -s "$screenshot"
            ' bash \
            "$app/bin/ofxICExample" \
            "$artifact_dir/ofxICExample.log" \
            "$result" \
            "$artifact_dir/ofxICExample-image.png"

          image_path="$(sed -n 's/^Saved: //p' "$result" | tail -n 1)"
          test -n "$image_path"
          test -s "$image_path"
          cp "$image_path" "$artifact_dir/generated-image.png"
          identify -format '%m %wx%h\n' "$artifact_dir/generated-image.png" \
            >"$artifact_dir/image.txt"
          grep -Fxq "PNG 8x8" "$artifact_dir/image.txt"
          cat "$result"
          cat "$artifact_dir/image.txt"

      - name: Upload deterministic image GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-image-fixture
          path: ${{ runner.temp }}/image-gui-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Exercise deterministic native video through GUI
        timeout-minutes: 5
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          OFXIC_MEDIA_BACKEND: sdcpp
          OFXIC_MEDIA_ENDPOINT_URL: http://127.0.0.1:18080
          OFXIC_MEDIA_AUTORUN: video
          OFXIC_MEDIA_PROMPT: "Deterministic moving test pattern"
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/video-gui-smoke"
          result="$artifact_dir/result.txt"
          fixture="$artifact_dir/fixture.mp4"
          server_log="$artifact_dir/server.log"
          mkdir -p "$artifact_dir"

          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=320x180:rate=12:duration=2" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            "$fixture"

          VIDEO_FIXTURE="$fixture" python3 -u - >"$server_log" 2>&1 <<'PY' &
          import base64
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          video = base64.b64encode(open(os.environ["VIDEO_FIXTURE"], "rb").read()).decode("ascii")

          class Handler(BaseHTTPRequestHandler):
              def send_json(self, status, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/health":
                      self.send_json(200, {"status": "ok"})
                  elif self.path == "/sdcpp/v1/jobs/fixture-video":
                      self.send_json(200, {
                          "id": "fixture-video",
                          "kind": "vid_gen",
                          "status": "completed",
                          "result": {
                              "output_format": "mp4",
                              "mime_type": "video/mp4",
                              "fps": 12,
                              "frame_count": 24,
                              "b64_json": video,
                          },
                          "error": None,
                      })
                  else:
                      self.send_json(404, {"error": "not found"})

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  self.rfile.read(length)
                  if self.path == "/sdcpp/v1/vid_gen":
                      self.send_json(202, {
                          "id": "fixture-video",
                          "kind": "vid_gen",
                          "status": "queued",
                          "poll_url": "/sdcpp/v1/jobs/fixture-video",
                      })
                  else:
                      self.send_json(404, {"error": "not found"})

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT

          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:18080/health >/dev/null && break
            kill -0 "$server_pid" 2>/dev/null || { cat "$server_log" >&2; exit 1; }
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18080/health >/dev/null
          export OFXIC_MEDIA_RESULT_PATH="$result"

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"
              log="$2"
              result="$3"
              screenshot="$4"

              "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup_app() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup_app EXIT

              window_id=""
              for _ in $(seq 1 60); do
                window_id="$(xdotool search --name "^ofxIC Endpoint Workbench$" 2>/dev/null | head -n 1 || true)"
                [[ -n "$window_id" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.25
              done
              [[ -n "$window_id" ]] || { echo "Example window did not appear" >&2; exit 1; }

              for _ in $(seq 1 120); do
                [[ -s "$result" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.25
              done
              [[ -s "$result" ]] || { echo "Timed out waiting for fixture video" >&2; cat "$log" >&2; exit 1; }
              grep -Fq "Video job fixture-video is completed" "$result"
              grep -Fq "Saved:" "$result"

              sleep 2
              import -display "$DISPLAY" -window "$window_id" "$screenshot"
              test -s "$screenshot"
            ' bash \
            "$app/bin/ofxICExample" \
            "$artifact_dir/ofxICExample.log" \
            "$result" \
            "$artifact_dir/ofxICExample-video.png"

          media_path="$(sed -n 's/^Saved: //p' "$result" | tail -n 1)"
          test -n "$media_path"
          test -s "$media_path"
          cp "$media_path" "$artifact_dir/generated-video.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 "$artifact_dir/generated-video.mp4" \
            >"$artifact_dir/video.txt"
          cat "$result"
          cat "$artifact_dir/video.txt"

      - name: Upload deterministic video GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-video-fixture
          path: ${{ runner.temp }}/video-gui-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Control GUI against Hugging Face
        if: >-
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[hf-gui-smoke]')
        timeout-minutes: 5
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          OFXIC_API_KEY: ${{ secrets.HF_TOKEN }}
          OFXIC_MODEL: ${{ vars.HF_MODEL || 'openai/gpt-oss-120b' }}
          OFXIC_ENDPOINT_URL: ${{ vars.HF_SERVER_URL || 'https://router.huggingface.co/v1' }}
        run: |
          set -euo pipefail
          if [[ -z "$OFXIC_API_KEY" ]]; then
            echo "HF_TOKEN is missing" >&2
            exit 1
          fi

          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/hf-gui-smoke"
          result="$artifact_dir/result.txt"
          mkdir -p "$artifact_dir"
          export OFXIC_GUI_RESULT_PATH="$result"

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"
              log="$2"
              result="$3"
              screenshot="$4"
              prompt="$5"

              "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup EXIT

              window_id=""
              for _ in $(seq 1 60); do
                if ! kill -0 "$app_pid" 2>/dev/null; then
                  echo "Example exited before its window appeared" >&2
                  cat "$log" >&2
                  exit 1
                fi
                window_id="$(xdotool search --name "^ofxIC Endpoint Workbench$" 2>/dev/null | head -n 1 || true)"
                [[ -n "$window_id" ]] && break
                sleep 0.25
              done
              [[ -n "$window_id" ]] || { echo "Example window did not appear" >&2; exit 1; }

              xdotool type --window "$window_id" --clearmodifiers --delay 1 "$prompt"
              xdotool key --window "$window_id" Return

              for _ in $(seq 1 360); do
                [[ -s "$result" ]] && break
                if ! kill -0 "$app_pid" 2>/dev/null; then
                  echo "Example exited while waiting for Hugging Face" >&2
                  cat "$log" >&2
                  exit 1
                fi
                sleep 0.5
              done

              if [[ ! -s "$result" ]]; then
                echo "Timed out waiting for the GUI result" >&2
                cat "$log" >&2
                exit 1
              fi
              if ! grep -Fq "Inference completed with 2 model request(s)" "$result"; then
                echo "GUI request did not complete the expected tool round" >&2
                cat "$result" >&2
                exit 1
              fi
              if ! grep -Fq "architecture.md#chunk-1" "$result"; then
                echo "GUI answer omitted the document source identifier" >&2
                cat "$result" >&2
                exit 1
              fi

              sleep 1
              import -display "$DISPLAY" -window "$window_id" "$screenshot"
              test -s "$screenshot"
            ' bash \
            "$app/bin/ofxICExample" \
            "$artifact_dir/ofxICExample.log" \
            "$result" \
            "$artifact_dir/ofxICExample-huggingface.png" \
            "Why is the model runtime outside the addon? Answer in one short sentence."

          {
            echo "model=$OFXIC_MODEL"
            echo "endpoint=$OFXIC_ENDPOINT_URL"
            echo "openFrameworks=$OF_NIGHTLY_ASSET"
          } >"$artifact_dir/build.txt"
          cat "$result"

      - name: Upload Hugging Face GUI artifacts
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[hf-gui-smoke]')
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-huggingface-gui
          path: ${{ runner.temp }}/hf-gui-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Run selected Hugging Face media through the GUI example
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.hf_media_task != 'none'
        timeout-minutes: 20
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          OFXIC_MEDIA_API_KEY: ${{ secrets.HF_TOKEN }}
          OFXIC_MEDIA_BACKEND: huggingface
          OFXIC_MEDIA_AUTORUN: ${{ inputs.hf_media_task }}
          OFXIC_MEDIA_IMAGE_MODEL: ${{ inputs.hf_image_model }}
          OFXIC_MEDIA_VIDEO_MODEL: ${{ inputs.hf_video_model }}
          OFXIC_MEDIA_PROMPT: "A small paper sculpture slowly turns on a clean studio background"
        run: |
          set -euo pipefail
          app="$OF_ROOT/apps/myApps/ofxICExample"
          artifact_dir="$RUNNER_TEMP/hf-media-gui-smoke"
          result="$artifact_dir/result.txt"
          mkdir -p "$artifact_dir"

          if [[ -z "$OFXIC_MEDIA_API_KEY" ]]; then
            echo "HF_TOKEN is missing" | tee "$result" >&2
            exit 1
          fi

          export OFXIC_MEDIA_RESULT_PATH="$result"

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp" \
            bash -euo pipefail -c '
              binary="$1"
              log="$2"
              result="$3"
              screenshot="$4"

              "$binary" >"$log" 2>&1 &
              app_pid=$!
              cleanup() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup EXIT

              window_id=""
              for _ in $(seq 1 60); do
                window_id="$(xdotool search --name "^ofxIC Endpoint Workbench$" 2>/dev/null | head -n 1 || true)"
                [[ -n "$window_id" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.25
              done
              [[ -n "$window_id" ]] || { echo "Example window did not appear" >&2; exit 1; }

              for _ in $(seq 1 1800); do
                [[ -s "$result" ]] && break
                kill -0 "$app_pid" 2>/dev/null || { cat "$log" >&2; exit 1; }
                sleep 0.5
              done
              [[ -s "$result" ]] || { echo "Timed out waiting for HF media" >&2; cat "$log" >&2; exit 1; }
              if grep -Eiq "failed|timed out" "$result"; then
                cat "$result" >&2
                exit 1
              fi
              grep -Fq "Saved:" "$result"
              sleep 1
              import -display "$DISPLAY" -window "$window_id" "$screenshot"
            ' bash \
            "$app/bin/ofxICExample" \
            "$artifact_dir/ofxICExample.log" \
            "$result" \
            "$artifact_dir/ofxICExample-hf-media.png"

          media_path="$(sed -n 's/^Saved: //p' "$result" | tail -n 1)"
          if [[ -z "$media_path" || ! -s "$media_path" ]]; then
            echo "Generated media file is missing: $media_path" >&2
            exit 1
          fi
          media_extension="${media_path##*.}"
          cp "$media_path" "$artifact_dir/generated-${OFXIC_MEDIA_AUTORUN}.${media_extension}"

          cat "$result"

      - name: Upload Hugging Face media GUI artifacts
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.hf_media_task != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ofxICExample-huggingface-${{ inputs.hf_media_task }}
          path: ${{ runner.temp }}/hf-media-gui-smoke
          if-no-files-found: error
          retention-days: 14
