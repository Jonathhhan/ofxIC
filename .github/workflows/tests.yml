name: tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deterministic-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S tests -B tests/build
      - name: Build
        run: cmake --build tests/build --config Release
      - name: Test
        run: ctest --test-dir tests/build -C Release --output-on-failure
