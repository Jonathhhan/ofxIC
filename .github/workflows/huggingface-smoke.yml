name: Hugging Face live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: huggingface-live-smoke
  cancel-in-progress: false

jobs:
  tool-protocol:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[hf-smoke]')
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OFXIC_API_KEY: ${{ secrets.HF_TOKEN }}
      OFXIC_MODEL: ${{ vars.HF_MODEL || 'openai/gpt-oss-120b' }}
      OFXIC_ENDPOINT_URL: ${{ vars.HF_SERVER_URL || 'https://router.huggingface.co/v1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run hosted tool protocol
        shell: cmd
        run: scripts\smoke-huggingface.bat
